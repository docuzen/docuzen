[package]
name = "docuzen"
version = "0.4.0-nightly.20261123.4"
description = "docuzen desktop shell (Tauri)"
authors = ["docuzen"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "docuzen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# The per-launch docd token comes from the OS RNG.
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Reading a dropped file's path from the drag pasteboard (src/drag_paths.rs). The same
# versions tao and wry already use.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(unix)'.dependencies]
# kill(2) on the sidecar's process group: std can only SIGKILL a single child.
libc = "0.2"

